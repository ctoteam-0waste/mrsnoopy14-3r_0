<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>

    <!-- Referral links land on /register?ref=CODE (backend /r/:code redirect). This
         app's auth screen lives at /login, so rewrite before the SPA router boots
         (preserving ?ref=) — otherwise the unknown-route handler shows a 404. -->
    <script>
      (function () {
        if (location.pathname.replace(/\/+$/, '') === '/register') {
          history.replaceState(null, '', '/login' + location.search + location.hash);
        }
      })();
    </script>

    <!-- Warm up the origins the app talks to on load (DNS + TLS handshake), so the
         first analytics hit and the first API call don't pay full connection latency.
         Google Sign-In / Facebook load only on the login action, so dns-prefetch is
         enough for them. -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://api.karmaverse.earth" crossorigin />
    <link rel="dns-prefetch" href="https://accounts.google.com" />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <!-- Google Search Console ownership verification -->
    <meta name="google-site-verification" content="hjZP0SOm9CiCTAiAiNG_4-GoW_5mUQR9h-N4wdxMJng" />

    <!-- Google Analytics 4 is loaded by src/utils/analytics.ts from the
         EXPO_PUBLIC_GA_MEASUREMENT_ID env var (see .env), not hardcoded here. -->

    <!-- Canonical + robots -->
    <link rel="canonical" href="https://karmaverse.earth/" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="sustainability rewards platform, circular economy, KarmaCoins, eco rewards, recycling rewards, climate action, environmental sustainability, waste management, green rewards, eco-friendly lifestyle, recycling app, doorstep recycling pickup, 3R ZeroWaste, Gurugram recycling, Haryana recycling" />
    <meta name="author" content="3R ZeroWaste" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="KarmaVerse" />
    <meta property="og:title" content="KarmaVerse — Turning Sustainable Gestures into Rewards" />
    <meta property="og:description" content="KarmaVerse is India's sustainability rewards ecosystem — earn KarmaCoins for everyday eco-friendly actions and redeem them for real rewards while creating measurable environmental impact." />
    <meta property="og:url" content="https://karmaverse.earth/" />
    <meta property="og:image" content="https://karmaverse.earth/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="KarmaVerse — Turning Sustainable Gestures into Rewards" />
    <meta name="twitter:description" content="India's sustainability rewards ecosystem — earn KarmaCoins for everyday eco-friendly actions and redeem them for real rewards." />
    <meta name="twitter:image" content="https://karmaverse.earth/og-image.png" />

    <!-- Icons + manifest -->
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Structured data: the organization behind KarmaVerse -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "3R ZeroWaste",
        "legalName": "3R ZeroWaste Private Limited",
        "url": "https://0waste.co.in/",
        "logo": "https://karmaverse.earth/apple-touch-icon.png",
        "email": "cto.team@0waste.co.in",
        "telephone": "+91-70931-98828",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot 62, Sector 8, IMT Manesar",
          "addressLocality": "Gurugram",
          "addressRegion": "Haryana",
          "postalCode": "122051",
          "addressCountry": "IN"
        }
      }
    </script>

    <!-- Structured data: the KarmaVerse product itself -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "KarmaVerse",
        "url": "https://karmaverse.earth/",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Android, iOS, Web",
        "description": "India's first circular economy rewards platform. Schedule free doorstep pickups for plastic, paper, metal, e-waste & more, and earn KarmaCoins XP for every kg you recycle.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        },
        "publisher": {
          "@type": "Organization",
          "name": "3R ZeroWaste",
          "url": "https://0waste.co.in/"
        }
      }
    </script>

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* No horizontal page scroll on ANY viewport. The test measures
         document.documentElement.scrollWidth vs clientWidth, so the clamp has to
         live on <html> itself — a position:fixed widget or a stray-wide element
         escapes body's overflow and still inflates html's scrollWidth otherwise. */
      html,
      body {
        overflow-x: hidden;
        max-width: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height. `100dvh` (dynamic
         viewport height) tracks mobile browsers' collapsing URL bar — plain
         100% leaves a dead gap under the app on phones. Older browsers fall
         back to the 100% line. */
      #root {
        display: flex;
        height: 100%;
        height: 100dvh;
        flex: 1;
      }
      /* Kill the browser's default black focus ring on inputs — every field
         already has its own styled container, so the ring double-highlights. */
      input:focus,
      input:focus-visible,
      textarea:focus,
      textarea:focus-visible,
      select:focus,
      select:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      /* Edge/IE add their own password reveal + clear buttons on
         <input type="password">. The app already renders its own eye toggle,
         so the native one shows up as a second eye — hide it. */
      input::-ms-reveal,
      input::-ms-clear {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <!-- LLM/crawler-visible fallback: this app is a client-rendered SPA, so bots that -->
    <!-- don't execute JavaScript only ever see this block plus the meta tags above. -->
    <noscript>
      <h1>KarmaVerse — Turning Sustainable Gestures into Rewards</h1>
      <p>
        KarmaVerse is India's sustainability rewards ecosystem, built by 3R ZeroWaste.
        Complete everyday sustainable actions — like doorstep recycling pickups for plastic,
        paper, metal, e-waste, textile and more — and earn KarmaCoins XP. Every action is
        verified, and coins are credited instantly, redeemable for eco-friendly products,
        gift cards, discounts, tree planting, or charitable donations.
      </p>
      <p>You need to enable JavaScript to run this app.</p>
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
