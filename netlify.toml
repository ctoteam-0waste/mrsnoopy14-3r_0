  status = 200
[[redirects]]
  from = "/blog/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/legal/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/feedback"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/unsubscribe"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/preferences"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/register"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/r/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/festival/*"
  to = "/index.html"
  status = 200

# Everything else still gets the app shell, so a person sees the app's own "not found" screen
# (and a screen missing from the list above keeps working for people), but with a real 404
# status, so search engines stop indexing made-up URLs as copies of the homepage.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
