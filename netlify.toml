[build]
  command = "npm run build:web"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The `staging` branch and PR previews build against the testing backend; the
# production branch keeps the default (https://api.karmaverse.earth).
[context.staging.environment]
  EXPO_PUBLIC_API_URL = "https://karmacoin-backend-11.onrender.com"

[context.deploy-preview.environment]
  EXPO_PUBLIC_API_URL = "https://karmacoin-backend-11.onrender.com"

# Expo's JS bundles and bundled assets carry a content hash in their file names, so a
# changed file always gets a new URL — safe to cache for a year instead of Netlify's
# default max-age=0, which made every visit revalidate every file.
[[headers]]
  for = "/_expo/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Android fetches this to verify the app may open karmaverse.earth links (App Links).
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# iOS fetches this (through Apple's CDN) to verify the app may open karmaverse.earth
# links (Universal Links). It has no file extension, so the type is set here.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

# Legacy URLs from an earlier version of the site — still hold external backlinks and
# Search Console referrals, so redirect them to their current equivalents instead of
# silently serving the homepage shell (which the old catch-all below did).
[[redirects]]
  from = "/privacy-policy/*"
  to = "/legal/privacy/"
  status = 301

# Real prerendered files (/, /login, /legal/privacy, /legal/terms, /legal/data-deletion) are served as-is.
# Netlify only falls through to the rules below for paths with no matching static file.
#
# In-app screens (client-side routed by React Navigation) get the app shell with 200. Keep this
# list in step with the `linking` config in src/navigation/RootNavigator.tsx. Shared links:
# /r/CODE (referrals), /festival/<slug>, /blog/<slug>, /legal/<type>, /register?ref=.
[[redirects]]
  from = "/Dashboard"
  to = "/index.html"
  status = 200
[[redirects]]
