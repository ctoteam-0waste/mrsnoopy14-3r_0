  to = "/index.html"
  status = 200
[[redirects]]
  from = "/KnowledgeHub"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/ArticleDetail"
  to = "/index.html"
  status = 200
[[redirects]]
